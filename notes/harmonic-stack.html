<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonic stack — piano-transcribe notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="nav" class="site-nav"></nav>
  <main id="root"></main>
  <script src="common.js"></script>
  <script>
    nav("harmonic-stack");
    const MIDI = 60;
    const F = midiToHz(MIDI);
    const CYCLES = 3;
    const N = 280;
    const T_END = CYCLES / F;
    const Y_ABS = 1 + 1 / 2 + 1 / 3 + 1 / 4;
    const W = 800, H = 260, PL = 44, PR = 16, PT = 18, PB = 32;
    const colors = [T.blue, T.purple, T.green, T.yellow];
    const PARTIALS = [1, 2, 3, 4].map((k) => ({
      k,
      freq: F * k,
      amp: 1 / k,
      role: k === 1 ? "fundamental (the pitch you hear)" : k === 2 ? "octave" : k === 3 ? "octave + fifth" : "two octaves",
      ys: Array.from({ length: N }, (_, i) => Math.sin(2 * Math.PI * F * k * ((i / (N - 1)) * T_END)) / k),
    }));

    let enabled = [true, true, true, true];
    let showPartials = true;

    function waveform() {
      const active = PARTIALS.filter((_, i) => enabled[i]);
      const sum = Array.from({ length: N }, (_, i) => active.reduce((a, p) => a + p.ys[i], 0));
      const yAt = (v) => PT + ((Y_ABS - v) / (2 * Y_ABS)) * (H - PT - PB);
      const ticks = [0, 1, 2, 3].map((c) => ({
        x: PL + (c / CYCLES) * (W - PL - PR),
        label: ((c / F) * 1000).toFixed(1),
      }));
      const partials = showPartials
        ? PARTIALS.map((p, i) =>
            enabled[i]
              ? `<path d="${toPath(p.ys, W, H, -Y_ABS, Y_ABS, PL, PR, PT, PB)}" fill="none" stroke="${colors[i]}" stroke-width="1.25" opacity="0.55"/>`
              : "",
          ).join("")
        : "";
      return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
        <line x1="${PL}" y1="${PT}" x2="${PL}" y2="${H - PB}" stroke="${T.line}"/>
        <line x1="${PL}" y1="${H - PB}" x2="${W - PR}" y2="${H - PB}" stroke="${T.line}"/>
        <line x1="${PL}" y1="${yAt(0)}" x2="${W - PR}" y2="${yAt(0)}" stroke="${T.line}" stroke-dasharray="4 4"/>
        ${[-2, -1, 0, 1, 2].map((v) => `<text x="${PL - 8}" y="${yAt(v) + 4}" text-anchor="end" fill="${T.faint}" font-size="11">${v}</text>`).join("")}
        ${ticks.map((t) => `<g><line x1="${t.x}" y1="${H - PB}" x2="${t.x}" y2="${H - PB + 4}" stroke="${T.line}"/><text x="${t.x}" y="${H - 10}" text-anchor="middle" fill="${T.faint}" font-size="11">${t.label}</text></g>`).join("")}
        <text x="${(PL + W - PR) / 2}" y="${H - 1}" text-anchor="middle" fill="${T.faint}" font-size="10">Time (ms)</text>
        ${partials}
        <path d="${toPath(sum, W, H, -Y_ABS, Y_ABS, PL, PR, PT, PB)}" fill="none" stroke="${T.accent}" stroke-width="2.25"/>
      </svg>`;
    }

    function render() {
      const nOn = enabled.filter(Boolean).length;
      const ampSum = PARTIALS.reduce((s, p, i) => s + (enabled[i] ? p.amp : 0), 0);
      const active = PARTIALS.filter((_, i) => enabled[i]);
      document.getElementById("root").innerHTML = `
        <h1>Four sines stacked into one note</h1>
        <p class="lede">Line 22 of <code>pluck()</code> builds C4 (MIDI 60, 261.6 Hz) by adding the fundamental and three overtones. Toggle a partial off to see what it contributes to the sum.</p>
        ${card("pluck()", `<p><code>wave = sum(sin(2π f k t) / k for k in 1..4)</code></p>
          <p class="small"><code>k</code> is the harmonic number. Frequency is <code>k * f</code>. Amplitude is <code>1/k</code>, so higher overtones are quieter — a cheap sawtooth-ish string spectrum.</p>`, "transcribe.py:22")}
        ${statsHtml([
          { value: "261.6 Hz", label: "C4 fundamental (k=1)" },
          { value: `${nOn} / 4`, label: "Partials in the sum" },
          { value: ampSum.toFixed(2), label: "Peak amplitude bound (Σ 1/k)" },
          { value: "11.5 ms", label: "Window (3 cycles of f)" },
        ])}
        <div class="row" id="pills"></div>
        <label class="check"><input type="checkbox" id="show" ${showPartials ? "checked" : ""}> Draw each partial under the sum</label>
        <h2>Waveform — selected partials and their sum</h2>
        ${waveform()}
        <p class="caption">Thick accent line is the sum (the actual <code>wave</code>). Thin colored lines are the individual <code>sin(2π f k t) / k</code> terms. Source: transcribe.py <code>pluck()</code> · MIDI 60 · no decay.</p>
        <div class="grid grid-2">
          <div>
            <h2>Amplitude of each partial (1/k)</h2>
            ${nOn ? barChart({ categories: active.map((p) => "k=" + p.k), data: active.map((p) => Number(p.amp.toFixed(3))), yMax: 1 }) : ""}
            <p class="caption">Same <code>/ k</code> weights as the Python generator expression.</p>
          </div>
          <div>
            <h2>What each k is</h2>
            ${tableHtml({
              headers: ["k", "Hz", "Amp", "Interval"],
              align: ["right", "right", "right", "left"],
              tones: PARTIALS.map((_, i) => (enabled[i] ? "info" : "neutral")),
              rows: PARTIALS.map((p, i) => [enabled[i] ? String(p.k) : p.k + " (off)", p.freq.toFixed(1), "1/" + p.k, p.role]),
            })}
          </div>
        </div>
      `;
      document.getElementById("pills").innerHTML = PARTIALS.map(
        (p, i) =>
          `<button class="pill ${enabled[i] ? "active" : ""}" data-i="${i}"><span class="swatch" style="background:${colors[i]}"></span>k=${p.k}  ${p.freq.toFixed(0)} Hz  /${p.k}</button>`,
      ).join("");
      document.querySelectorAll("#pills .pill").forEach((b) => {
        b.onclick = () => {
          const i = +b.dataset.i;
          enabled[i] = !enabled[i];
          render();
        };
      });
      document.getElementById("show").onchange = (e) => {
        showPartials = e.target.checked;
        render();
      };
    }
    render();
  </script>
</body>
</html>
